# nginx config for the forecast page on CT 350 (F1 spec #47 Module 11; D52 items 7-9;
# D83). Installed as /etc/astro-web/nginx.conf by scripts/install_services.sh and run by
# astro-web.service as a systemd dynamic user, so it names no `user` and writes only to
# /run/astro-web/ (pid, request buffers) and /var/log/astro-web/ (access log). Errors go
# to stderr, which is the journal.
#
#   /                 -> /forecast/
#   /forecast/, /version.json   the deployed page (`astro web deploy`), revalidated
#                                on every load so a deploy or rollback shows at once
#   /data/latest.json           Cache-Control: no-cache, with an ETag (D52 item 3)
#   /data/sets/<set_id>/        a product set: never changes, so cached for a year
#   /data/sunset/<night>/       the sunset maps (D60 item 3)
# Nothing else under the products folder (the tick's own stores) is served.

daemon off;
worker_processes 1;
pid /run/astro-web/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    # The few kinds of file the site has; module scripts need a JavaScript type.
    types {
        text/html                 html;
        text/css                  css;
        text/javascript           js mjs;
        application/json          json;
        image/svg+xml             svg;
        image/png                 png;
        text/plain                txt;
        text/markdown             md;
        application/octet-stream  u8 u16 i16;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/javascript application/json text/plain text/markdown;

    client_body_temp_path /run/astro-web/client_body;
    proxy_temp_path       /run/astro-web/proxy;
    fastcgi_temp_path     /run/astro-web/fastcgi;
    uwsgi_temp_path       /run/astro-web/uwsgi;
    scgi_temp_path        /run/astro-web/scgi;
    access_log /var/log/astro-web/access.log;

    sendfile on;
    server_tokens off;
    autoindex off;

    # Layers and JSON go compressed (map layers compress well). `gzip_proxied any`:
    # requests arrive through Nginx Proxy Manager.
    gzip on;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css text/javascript application/json image/svg+xml text/plain
               text/markdown application/octet-stream;

    server {
        # LAN port 8350; only Nginx Proxy Manager is meant to use it (D52 item 8).
        listen 8350;
        root /staging/forecast/site/current;

        location = / {
            return 302 /forecast/;
        }
        location / {
            add_header Cache-Control "no-cache" always;
        }
        location ~ /\. {
            return 404;
        }

        location /data/ {
            return 404;
        }
        location = /data/latest.json {
            alias /staging/forecast/products/latest.json;
            add_header Cache-Control "no-cache" always;
        }
        location /data/sets/ {
            alias /staging/forecast/products/sets/;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }
        location /data/sunset/ {
            alias /staging/forecast/products/sunset/;
            add_header Cache-Control "no-cache" always;
        }
    }
}
